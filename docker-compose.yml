services:
  poker_backend:
    build: ./backend
    container_name: poker_backend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      NODE_ENV: production
    networks:
      - web
      - internal

  poker_frontend:
    build: ./frontend
    container_name: poker_frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - poker_backend
    networks:
      - web

networks:
  web:
    external: true
  internal:
    driver: bridge
